.small { font-size: 10px; fill: #64748B; }
.axis { stroke: #94A3B8; stroke-width: 1; }
.grid { stroke: #E2E8F0; stroke-width: 1; }
</style>
<rect width="1040" height="640" fill="white"/>
<text x="36" y="34" class="title">Token/accuracy tradeoff frontier</text>
<text x="36" y="56" class="subtitle">X-axis is log-scaled total tokens; null atom pass-rate is plotted at 0 and labelled n/a.</text>
