# Parameter sweep for the cost-equation study (cost_model.py).
#
#   python -m concord.experiments.cost_model \
#       --config concord/config/wide_and_deep.yaml \
#       --sweep  concord/config/cost_model.sweep.yaml
#
# Independent variables = the solver knobs in chess_study._key_params (NOT the
# number of plies and NOT per-model output-token caps). Varying these knobs
# spreads the input/output token volume per model, which is what the regression
# needs to fit each model's  cost = a·input + b·output  equation. Problem size
# (--max-plies) is held fixed as a cost bound, not swept.
#
# The executor / splitter / combiner are routed through each model in the set so
# every model accrues real usage and gets its own equation.

repeats: 1

runs:
  # ---- claude-sonnet-4-6 across knob settings -------------------------
  - {label: sonnet_baseline, overrides: {models.execution.model: claude-sonnet-4-6, models.splitter.model: claude-sonnet-4-6, models.combiner.model: claude-sonnet-4-6}}
  - {label: sonnet_K1,       overrides: {models.execution.model: claude-sonnet-4-6, models.splitter.model: claude-sonnet-4-6, models.combiner.model: claude-sonnet-4-6, pipeline.K_executor: 1, pipeline.K_combiner: 1}}
  - {label: sonnet_K5,       overrides: {models.execution.model: claude-sonnet-4-6, models.splitter.model: claude-sonnet-4-6, models.combiner.model: claude-sonnet-4-6, pipeline.K_executor: 5, pipeline.K_combiner: 5, pipeline.max_node_calls: 200}}
  - {label: sonnet_depth4,   overrides: {models.execution.model: claude-sonnet-4-6, models.splitter.model: claude-sonnet-4-6, models.combiner.model: claude-sonnet-4-6, pipeline.max_split_depth: 4, pipeline.max_node_calls: 200}}
  - {label: sonnet_atoms5,   overrides: {models.execution.model: claude-sonnet-4-6, models.splitter.model: claude-sonnet-4-6, models.combiner.model: claude-sonnet-4-6, pipeline.max_atoms_per_split: 5, pipeline.max_node_calls: 200}}

  # ---- claude-opus-4-8 ------------------------------------------------
  - {label: opus_baseline,   overrides: {models.execution.model: claude-opus-4-8, models.splitter.model: claude-opus-4-8, models.combiner.model: claude-opus-4-8}}
  - {label: opus_K1,         overrides: {models.execution.model: claude-opus-4-8, models.splitter.model: claude-opus-4-8, models.combiner.model: claude-opus-4-8, pipeline.K_executor: 1, pipeline.K_combiner: 1}}
  - {label: opus_K5,         overrides: {models.execution.model: claude-opus-4-8, models.splitter.model: claude-opus-4-8, models.combiner.model: claude-opus-4-8, pipeline.K_executor: 5, pipeline.K_combiner: 5, pipeline.max_node_calls: 200}}
  - {label: opus_depth4,     overrides: {models.execution.model: claude-opus-4-8, models.splitter.model: claude-opus-4-8, models.combiner.model: claude-opus-4-8, pipeline.max_split_depth: 4, pipeline.max_node_calls: 200}}
  - {label: opus_atoms5,     overrides: {models.execution.model: claude-opus-4-8, models.splitter.model: claude-opus-4-8, models.combiner.model: claude-opus-4-8, pipeline.max_atoms_per_split: 5, pipeline.max_node_calls: 200}}

  # ---- claude-haiku-4-5 -----------------------------------------------
  - {label: haiku_baseline,  overrides: {models.execution.model: claude-haiku-4-5, models.splitter.model: claude-haiku-4-5, models.combiner.model: claude-haiku-4-5}}
  - {label: haiku_K1,        overrides: {models.execution.model: claude-haiku-4-5, models.splitter.model: claude-haiku-4-5, models.combiner.model: claude-haiku-4-5, pipeline.K_executor: 1, pipeline.K_combiner: 1}}
  - {label: haiku_K5,        overrides: {models.execution.model: claude-haiku-4-5, models.splitter.model: claude-haiku-4-5, models.combiner.model: claude-haiku-4-5, pipeline.K_executor: 5, pipeline.K_combiner: 5, pipeline.max_node_calls: 200}}
  - {label: haiku_depth4,    overrides: {models.execution.model: claude-haiku-4-5, models.splitter.model: claude-haiku-4-5, models.combiner.model: claude-haiku-4-5, pipeline.max_split_depth: 4, pipeline.max_node_calls: 200}}
  - {label: haiku_atoms5,    overrides: {models.execution.model: claude-haiku-4-5, models.splitter.model: claude-haiku-4-5, models.combiner.model: claude-haiku-4-5, pipeline.max_atoms_per_split: 5, pipeline.max_node_calls: 200}}
