# PLIES study for the pipeline solver — isolates the impact of PROBLEM SIZE
# (number of UCI half-moves) on solvability and token consumption, holding the
# decomposition DEPTH and the sampling K fixed.
#
# Consumed by:
#   .venv/bin/python -m concord.experiments.chess_study \
#       --config concord/config/wide_and_deep.yaml \
#       --sweep  concord/config/param_study.sweep.yaml
#
# DESIGN — the ONLY independent variable is `max_plies` (how many half-moves of
# the 650-ply game the prompt is truncated to). Each run sets `vary: max_plies`
# / `value: <n>`; the runner re-truncates the prompt to <n> half-moves and grades
# it against the gold FEN at ply <n>, then the parameter-effects table reports
# solvability ratio + mean tokens vs plies. (Per-run plies are NOT a Config knob,
# so they live as `vary/value`, not in `overrides`; chess_study.py reads them.)
#
# Everything else is pinned in the `_fixed` anchor so plies is the sole mover:
#
#   pipeline.max_split_depth = 2   GIVEN decomposition depth (atoms per block).
#   pipeline.K_executor      = 5   GIVEN max-K (one of the 5 you swept).
#   pipeline.K_combiner      = 1   single combiner sample per block.
#   pipeline.max_node_calls  = 5000  per-node CallBudget ~unlimited so a larger
#                                    problem is never truncated by budget.
#   mcts.N                   = 256   per-block soft budget — high enough never to
#                                    truncate, bounded so the search converges and
#                                    tokens track problem size (a huge N inflates
#                                    rollouts/d_max/adaptive-stop and flattens it).
#
# `max_plies` is therefore driven entirely by this file (no --max-plies needed).
# `repeats > 1` makes solvability_ratio = solved / repeats meaningful (executor
# temperature is > 0) — bump it for a tighter success-rate estimate (cost scales
# with repeats x plies x K, so mind the spend at 650 plies / K=5).

repeats: 1

# Held identical across every plies run — problem size is the sole moving part.
_fixed: &fixed
  pipeline.max_split_depth: 2     # GIVEN depth
  pipeline.K_executor: 2          # GIVEN max-K
  pipeline.K_combiner: 1
  mcts.N: 256
  pipeline.max_node_calls: 5000

# Plies swept 20 -> 650 (full game). Doubling spread captures the cost/solvability
# curve cheaply; edit the list to taste (e.g. linear 20,40,...,650).
runs:
  - label: "max_plies=20"
    vary: max_plies
    value: 20
    overrides: {<<: *fixed}

  - label: "max_plies=40"
    vary: max_plies
    value: 40
    overrides: {<<: *fixed}

  - label: "max_plies=80"
    vary: max_plies
    value: 80
    overrides: {<<: *fixed}

  - label: "max_plies=160"
    vary: max_plies
    value: 160
    overrides: {<<: *fixed}

  - label: "max_plies=320"
    vary: max_plies
    value: 320
    overrides: {<<: *fixed}

  - label: "max_plies=650"          # full game (650 half-moves)
    vary: max_plies
    value: 650
    overrides: {<<: *fixed}

# ---------------------------------------------------------------------------
# Reference sweeps (commented) — uncomment a block + comment out the plies
# `runs:` above to switch the study. Pair each with the right --max-plies.
# ---------------------------------------------------------------------------
#
# DEPTH sweep — vary pipeline.max_split_depth (atoms depth), K fixed at 1:
# _fixed_depth: &fixed_depth
#   pipeline.K_executor: 1
#   pipeline.K_combiner: 1
#   mcts.N: 256
#   pipeline.max_node_calls: 5000
# runs:
#   - {label: "max_split_depth=1", vary: pipeline.max_split_depth, value: 1,
#      overrides: {<<: *fixed_depth, pipeline.max_split_depth: 1}}
#   - {label: "max_split_depth=2", vary: pipeline.max_split_depth, value: 2,
#      overrides: {<<: *fixed_depth, pipeline.max_split_depth: 2}}
#   - {label: "max_split_depth=3", vary: pipeline.max_split_depth, value: 3,
#      overrides: {<<: *fixed_depth, pipeline.max_split_depth: 3}}
#   - {label: "max_split_depth=4", vary: pipeline.max_split_depth, value: 4,
#      overrides: {<<: *fixed_depth, pipeline.max_split_depth: 4}}
#   - {label: "max_split_depth=5", vary: pipeline.max_split_depth, value: 5,
#      overrides: {<<: *fixed_depth, pipeline.max_split_depth: 5}}
#   - {label: "max_split_depth=6", vary: pipeline.max_split_depth, value: 6,
#      overrides: {<<: *fixed_depth, pipeline.max_split_depth: 6}}
#
# K_EXECUTOR sweep — vary pipeline.K_executor, depth fixed at 2:
# _fixed_k: &fixed_k
#   pipeline.K_combiner: 1
#   mcts.N: 256
#   pipeline.max_node_calls: 5000
#   pipeline.max_split_depth: 2
# runs:
#   - {label: "K_executor=1", vary: pipeline.K_executor, value: 1, overrides: {<<: *fixed_k, pipeline.K_executor: 1}}
#   - {label: "K_executor=2", vary: pipeline.K_executor, value: 2, overrides: {<<: *fixed_k, pipeline.K_executor: 2}}
#   - {label: "K_executor=3", vary: pipeline.K_executor, value: 3, overrides: {<<: *fixed_k, pipeline.K_executor: 3}}
#   - {label: "K_executor=4", vary: pipeline.K_executor, value: 4, overrides: {<<: *fixed_k, pipeline.K_executor: 4}}
#   - {label: "K_executor=5", vary: pipeline.K_executor, value: 5, overrides: {<<: *fixed_k, pipeline.K_executor: 5}}
#
# The full multi-parameter OFAT matrix is also available built-in via
#   .venv/bin/python -m concord.experiments.chess_study --ofat
