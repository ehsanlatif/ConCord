# Quality-optimized profile: opus everywhere, larger budget.
# Highest expected accuracy on the eval set; also the most expensive.

seed: 42

llm:
  provider: anthropic
  model: claude-opus-4-7
  temperature: 1.0
  max_output_tokens: 2048

models: {}                   # all roles use opus via the fallback

sampling:
  K_blackbox: 16

mcts:
  N: 256
  c_puct: 3.0
  C: 2.0
  beta: 0.5
  n_min: 3

confidence:
  alpha: 0.25
