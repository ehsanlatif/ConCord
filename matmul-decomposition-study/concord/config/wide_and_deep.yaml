# wide_and_deep — the production config for the new pipeline solver.
#
# This is the "real run" preset. It opts into the Split → Solve → Combine →
# Verify pipeline (cfg.solver = "pipeline") and dials cost knobs to the
# values agreed in the 2026-06-16 strategy review:
#
#   - executor / splitter / combiner / block-verifier = Sonnet 4.6 (cheap)
#   - synthesizer + synth-verifier                    = Opus 4.8 (strong final)
#   - K_executor = K_combiner = 3   (reduced from 16)
#   - mcts.N      = 64              (reduced from 1024)
#   - pipeline.max_split_depth = 6  (recursive splitter; only split when
#                                    the question is actually decomposable)
#   - backtracking thresholds: 0.75 accept / 0.50 retry / 0.25 backtrack
#
# Earlier wide_and_deep targeted the legacy MCTS-with-K=16 path. That
# preset cost ~$40 on question 0 of the eval set and produced garbled
# answers because the executor saw the WHOLE block. The new preset is
# ~5–8× cheaper and respects the LongCoT grader's `solution = [...]`
# output contract via the synthesizer.
#
# Run with:
#   .venv/bin/python -m concord.experiments.run_all \
#       --config concord/config/wide_and_deep.yaml

seed: 42

# Pipeline-mode solver — opts into the new Split→Solve→Combine→Verify
# expansion policy. The legacy MCTS expansion stays available via
# `solver: mcts` (default for tests).
solver: pipeline

llm:
  provider: anthropic
  model: claude-sonnet-4-6
  temperature: 1.0
  max_output_tokens: 4096
  request_timeout_s: 180.0

models:
  execution:
    provider: anthropic
    model: claude-sonnet-4-6      # ↓ from opus-4-8; ~5× cheaper input/output
    temperature: 1.0              # diversity is good for the K=3 cluster
    max_output_tokens: 4096       # atoms are smaller than full blocks

  decomposition:
    provider: anthropic
    model: claude-sonnet-4-6
    temperature: 0.3
    max_output_tokens: 2048

  classification:
    provider: anthropic
    model: claude-haiku-4-5
    temperature: 0.0
    max_output_tokens: 256

  verification:
    provider: anthropic
    model: claude-sonnet-4-6      # ↓ from opus; block-level scorer
    temperature: 0.0
    max_output_tokens: 1024

  # ----- Pipeline-only roles -----

  splitter:
    provider: anthropic
    model: claude-sonnet-4-6      # recursive splitter, depth ≤ 6
    temperature: 0.3
    max_output_tokens: 4096       # may emit several atoms in a list

  combiner:
    provider: anthropic
    model: claude-sonnet-4-6
    temperature: 0.5              # mild diversity for the K=3 cluster
    max_output_tokens: 4096

  synthesizer:
    provider: anthropic
    model: claude-opus-4-8        # strong final-answer assembler
    temperature: 0.3
    max_output_tokens: 8192       # final list emission can be long

  synth_verifier:
    provider: anthropic
    model: claude-opus-4-8        # final integrity check (cheap, 1 call)
    temperature: 0.0
    max_output_tokens: 2048

sampling:
  # Legacy K knobs — still consulted by the MCTS solver and by the
  # confidence scorer when clustering. Lowered to match cost target.
  K_blackbox: 3
  K_whitebox: 3
  laplace_a: 1.0

mcts:
  # Per-block rollout budget. Each pipeline-policy expansion costs
  # roughly  1 split + n_atoms*K_executor + K_combiner + 1 verify  calls.
  # With n_atoms≈3 and K=3 that's ~14 calls/rollout, so N=128 gives
  # ~1800 calls/block worst case before the soft-budget brakes — enough
  # for the synthesizer to receive a non-truncated answer on every block
  # (the 6/17 budget bump after the first end-to-end run revealed N=64
  # hit "budget_truncated" before all blocks committed).
  N: 256
  c_puct: 3.0
  C: 2.0
  beta: 0.5
  n_min: 3

depth:
  # MCTS structural depth headroom on top of critical_path. For per-block
  # sub-solves critical_path is 0 (each block is fed in isolation), so
  # this slack IS the d_max — controls how far MCTS can chain inside
  # one block. ↑ to 6 so the pipeline policy has room to backtrack
  # across multiple atomic answers before hitting the depth cap.
  slack: 6
  lam: 0.02

confidence:
  alpha: 0.25
  tau_pre: 0.6
  entail_threshold: 0.5

coherence:
  mode: incremental_hard
  soft_relax: true

pipeline:
  # HARD ceiling on agent calls per graph node. The recursive decomposition
  # (max_atoms_per_split ** max_split_depth leaves × K_executor) can reach
  # thousands of calls otherwise; this is the single guarantee that one node
  # never exceeds it, enforced inside the splitter recursion + the solve /
  # combine phases (see PipelineExpansionPolicy + CallBudget).
  max_node_calls: 100
  # Recursive splitter depth & branching. Each node's block is decomposed
  # into solution steps at depth 0 (the top-level block ALWAYS gets a real
  # splitter call — the char heuristic only short-circuits deeper sub-steps),
  # then each step is refined recursively until the LLM judges it atomic.
  # depth 3 × branching 3 = up to 27 leaves worst case; the call budget above
  # truncates the pathological tree, and most trees are far smaller because
  # the splitter returns "atomic" for simple steps. Raise for harder
  # problems (and raise max_node_calls with them), lower to cut cost.
  max_split_depth: 3
  max_atoms_per_split: 3          # cap, not target; splitter may emit fewer
  atom_short_circuit_chars: 300   # sub-steps (depth > 0) shorter than this
                                  # skip the splitter LLM and are treated atomic
  verifier_accept: 0.75
  verifier_retry: 0.50
  verifier_backtrack: 0.25
  combiner_retries: 2
  K_executor: 3
  K_combiner: 3
  sharedmem_topk: 3
