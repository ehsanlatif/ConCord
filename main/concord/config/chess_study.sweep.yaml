# Parameter sweep for the uci_to_fen cost / token study.
#
# Consumed by:
#   .venv/bin/python -m concord.experiments.chess_study \
#       --config concord/config/wide_and_deep.yaml \
#       --sweep  concord/config/chess_study.sweep.yaml
#
# Every run starts from the base --config (wide_and_deep.yaml) and applies the
# dotted `overrides` below on top of it. Override keys are dotted attribute
# paths into the Config (see core/config.py); `models.<role>.<field>` swaps
# the model for one role.
#
# `max_plies` truncates the 650-ply game so a study run is affordable; raise it
# (or delete it) to scale problem size and watch tokens grow. `repeats` re-runs
# each combination to measure variance (executor temperature is > 0).

max_plies: 40
repeats: 1

runs:
  - label: baseline               # wide_and_deep.yaml as shipped
    overrides: {}

  # ---- decomposition depth / branching --------------------------------
  - label: shallow_split
    overrides:
      pipeline.max_split_depth: 2

  - label: deep_split
    overrides:
      pipeline.max_split_depth: 4
      pipeline.max_node_calls: 200

  - label: wide_split
    overrides:
      pipeline.max_atoms_per_split: 5
      pipeline.max_node_calls: 200

  # ---- sampling K (executor / combiner cluster size) ------------------
  - label: K1_cheapest
    overrides:
      pipeline.K_executor: 1
      pipeline.K_combiner: 1

  - label: K5_diverse
    overrides:
      pipeline.K_executor: 5
      pipeline.K_combiner: 5
      pipeline.max_node_calls: 200

  # ---- rollout / node budget ------------------------------------------
  - label: big_budget
    overrides:
      mcts.N: 128
      pipeline.max_node_calls: 200

  # ---- verifier backtracking thresholds -------------------------------
  - label: strict_verify
    overrides:
      pipeline.verifier_accept: 0.90

  - label: lenient_verify
    overrides:
      pipeline.verifier_accept: 0.60

  # ---- model swaps on the executor (the per-move worker) --------------
  - label: opus_executor
    overrides:
      models.execution.model: claude-opus-4-8

  - label: haiku_executor
    overrides:
      models.execution.model: claude-haiku-4-5
